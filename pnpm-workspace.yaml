packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  protobufjs: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@expo/cli@57.0.32"
  - "@expo/config-plugins@57.0.11"
  - "@expo/router-server@57.0.14"
  - expo-modules-core@57.0.24
  - expo-modules-jsi@57.1.3
  - expo@57.0.31
